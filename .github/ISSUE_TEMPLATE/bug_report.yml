name: "🐛 Hata Bildirimi / Bug Report"
description: "G-Browser deneyimini geliştirmemize yardımcı olmak için bir hata kaydı oluşturun. / Create a report to help improve G-Browser."
title: "[Bug]: "
labels: [bug]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Bilgilendirme / Reminder
        Sorununuzu en hızlı şekilde çözebilmemiz için lütfen karşılaştığınız durumu açık ve adım adım anlatın. (Türkçe veya İngilizce yazabilirsiniz.)
        To help resolve your issue quickly, please describe the problem clearly and step by step.

        - **Resmi Dokümantasyon / Documentation:** [https://vedatguldu.github.io/g-browser/](https://vedatguldu.github.io/g-browser/)
        - **Destek Sayfası / Support:** [https://vedatguldu.github.io/g-browser/support.html](https://vedatguldu.github.io/g-browser/support.html)

  - type: checkboxes
    attributes:
      label: Ön Kontrol Listesi / Pre-Submission Checklist
      description: Lütfen göndermeden önce aşağıdaki maddeleri kontrol edin / Please check the items below before submitting.
      options:
        - label: Bu sorunun daha önce bildirilmediğinden emin olmak için mevcut kayıtları kontrol ettim. / I checked existing issues to avoid duplicates.
        - label: G-Browser'ın en güncel sürümünü kullanıyorum. / I am using the latest version of G-Browser.
        - label: Sorunun nasıl yeniden oluşturulacağını adım adım yazdım. / I provided step-by-step reproduction instructions.

  - type: textarea
    attributes:
      label: Hata Özeti / Bug Summary
      description: Hatayı kısaca ve net biçimde özetleyin. / Provide a clear and concise summary of the bug.
      placeholder: Kısa hata açıklaması / Brief description...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Yeniden Oluşturma Adımları / Reproduction Steps
      description: Hatayı tetikleyen adımları sırasıyla yazın. / List the steps to reproduce the behavior.
      placeholder: "1.\n2.\n3."
    validations:
      required: true

  - type: textarea
    attributes:
      label: Beklenen Davranış / Expected Behavior
      description: Normalde ne olmasını bekliyordunuz? / What did you expect to happen?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Gerçekleşen Davranış / Actual Behavior
      description: Gerçekte ne oldu? / What actually happened?
    validations:
      required: true

  - type: input
    attributes:
      label: G-Browser Sürümü / Browser Version
      placeholder: "v12.20.1"
    validations:
      required: true

  - type: input
    attributes:
      label: İşletim Sistemi ve Ekran Okuyucu (Varsa) / OS & Screen Reader (If applicable)
      placeholder: "Windows 11 x64 / NVDA 2024.4"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Ek Bağlam veya Ekran Görüntüsü / Additional Context or Screenshots
      description: Varsa konsol çıktısını, ekran görüntüsünü veya ek detayları buraya ekleyin. / Add any console logs, screenshots, or extra details here.
    validations:
      required: false
