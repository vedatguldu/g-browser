floorp.mcp.enabled = false

floorp.tabstrip.wheelguard = 0

services.sync.prefs.sync.floorp.browser.note.memos = true

# --- Memory management ---------------------------------------------------
# Gecko keeps freed heap pages mapped and schedules GC/CC lazily, so resident
# memory stays high after long uptime. The idle-memory-reclaim feature runs an
# explicit minimizeMemoryUsage() after input inactivity, only when enabled.
floorp.memory.idleReclaim = "{\"enabled\":false,\"idleThresholdSec\":60,\"pollIntervalSec\":60,\"minIntervalSec\":300,\"minResidentMB\":400,\"reclaimOnGhostWindows\":true}"
# Native App Shim requires the source-built Runtime and bundled executable.
floorp.browser.nativeApp.appShim.enabled = false

# Production runtime settings
security.allow_parent_unrestricted_js_loads = true
security.disallow_privileged_https_script_loads = false
nora.dev.allow_http_loader = false
layers.gpu-process.enabled = false
browser.newtabpage.enabled = true

# --- Secure DNS (DNS-over-HTTPS) & Network Acceleration ---
network.trr.mode = 2
network.trr.uri = "https://cloudflare-dns.com/dns-query"
network.trr.custom_uri = "https://cloudflare-dns.com/dns-query"
network.trr.bootstrapAddress = "1.1.1.1"
network.dns.echconfig.enabled = true
network.dns.use_https_rr_as_alpn = true
network.http.http3.enable = true
network.ssl_tokens_cache_enabled = true
network.tcp.keepalive.enabled = true
network.notify.IPv6 = false

# --- Native Tracking Protection, Total Cookie Protection & AdShield ---
privacy.trackingprotection.enabled = true
privacy.trackingprotection.pbmode.enabled = true
privacy.trackingprotection.cryptomining.enabled = true
privacy.trackingprotection.fingerprinting.enabled = true
privacy.trackingprotection.socialtracking.enabled = true
network.cookie.cookieBehavior = 5
privacy.query_stripping.enabled = true
privacy.query_stripping.strip_list = "__hsfp __hssc __hstc __s _hsenc _openstat dclid fbclid gbraid gclid hsCtsTracking igshid mc_eid ml_subscriber mkt_tok msclkid oft_c oft_ck oft_d oft_id oft_ids oft_k oft_lk oft_sk oly_anon_id oly_enc_id rb_clickid s_cid twclid vero_conv vero_id wbraid wickedid yclid"
floorp.adshield.enabled = true
floorp.mediadownloader.enabled = true
